name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-arm64
            runner: macos-latest
            bundles: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Setup macOS signing (macOS only)
        if: matrix.platform == 'macos-arm64' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create keychain
          security create-keychain -p ${{ env.KEYCHAIN_PASSWORD }} build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ${{ env.KEYCHAIN_PASSWORD }} build.keychain
          
          # Import certificate
          echo "${{ env.APPLE_CERTIFICATE }}" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "${{ env.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ${{ env.KEYCHAIN_PASSWORD }} build.keychain
          
          # Cleanup
          rm certificate.p12
      - run: npm run tauri -- build
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Cleanup keychain (macOS only)
        if: matrix.platform == 'macos-arm64' && always()
        run: |
          security delete-keychain build.keychain || true
      - uses: actions/upload-artifact@v4
        with:
          name: fm-mate-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
